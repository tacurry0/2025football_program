name: Update trapp player analysis
on:
  schedule:
    # Japan: 21:37, 00:37, 06:37. Official corrections are included on later runs.
    - cron: '37 12,15,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trapp-player-analysis.yml'
      - 'trapp/data/scripts/update_player_analysis.py'
      - 'trapp/data/scripts/build_2627_player_analysis.py'
      - 'trapp/gas/JLeague.gs'
permissions:
  contents: write
concurrency:
  group: trapp-player-analysis
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate official data
        run: python trapp/data/scripts/update_player_analysis.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Verify analysis consistency
        run: |
          node --test trapp/tests/*.test.cjs
          python -m unittest discover -s trapp/tests -p 'test_*.py'
      - name: Commit the complete snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trapp/data/results trapp/data/details trapp/data/standings trapp/data/history trapp/data/generated trapp/data/insights
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update trapp official records and player analysis'
          git pull --rebase origin main
          git push origin HEAD:main
